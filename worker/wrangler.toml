name = "clicky-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ELEVENLABS_VOICE_ID = "kPzsL2i3teMYv0FxEYQ6"

# Azure OpenAI backend (dev). Unset WORKFLOW_MODEL_BACKEND (or set it to
# "anthropic") before shipping the demo so the fork ships on the Anthropic
# default the README + tweet thread claim.
WORKFLOW_MODEL_BACKEND   = "azure_openai"
AZURE_OPENAI_ENDPOINT    = "https://csqr.openai.azure.com"
AZURE_OPENAI_DEPLOYMENT  = "gpt-4.1"
AZURE_OPENAI_API_VERSION = "2025-01-01-preview"
